<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8D6" />
      <stop offset="100%" stop-color="#FFD1B3" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#C41230" stroke-width="2.5" />

  <!-- Shoulders & Clothes (Modern Smart Casual / Indonesian Collar) -->
  <path d="M22 92 C24 74 38 70 50 70 C62 70 76 74 78 92 Z" fill="url(#suitGrad)" />
  <!-- Red Inner Collar Accent -->
  <path d="M44 70 L50 78 L56 70 L54 66 L46 66 Z" fill="#C41230" />
  <!-- White Shirt V -->
  <path d="M46 66 L50 74 L54 66 Z" fill="#FFFFFF" />

  <!-- Neck -->
  <rect x="44" y="58" width="12" height="12" rx="3" fill="#F6B894" />

