  <!-- Ears -->
  <circle cx="31" cy="46" r="4.5" fill="#F6B894" />
  <circle cx="69" cy="46" r="4.5" fill="#F6B894" />

  <!-- Stylish Modern Hair -->
  <path d="M30 42 C30 25 42 20 54 21 C66 22 70 30 70 42 C66 36 60 33 50 33 C40 33 34 36 30 42 Z" fill="#241B18" />
  <path d="M46 22 C56 22 68 26 69 36 C64 30 55 28 44 28 C38 28 34 30 31 34 C32 26 38 22 46 22 Z" fill="#3D2D27" />

  <!-- Eyebrows -->
  <path d="M38 39 Q43 37 46 39" stroke="#241B18" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M54 39 Q57 37 62 39" stroke="#241B18" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Cute Big Sparkly Eyes -->
  <ellipse cx="42" cy="45" rx="3.2" ry="4" fill="#241B18" />
  <ellipse cx="58" cy="45" rx="3.2" ry="4" fill="#241B18" />
  <!-- Eye Sparkles -->
  <circle cx="43" cy="43.5" r="1.3" fill="#FFFFFF" />
  <circle cx="59" cy="43.5" r="1.3" fill="#FFFFFF" />

  <!-- Nose -->
  <path d="M50 46 Q51.5 50 49.5 51" stroke="#E29E7A" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <circle cx="37" cy="51" r="3.5" fill="#FF8A8A" opacity="0.4" />
  <circle cx="63" cy="51" r="3.5" fill="#FF8A8A" opacity="0.4" />

  <!-- Warm Friendly Smile -->
  <path d="M44 54 Q50 60 56 54" stroke="#A83A2A" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M46 55 Q50 59 54 55" fill="#FFFFFF" />
</svg>
