<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <!-- Mascot Onigiri Body -->
  <path
    d="M60 12 C75 12 100 70 94 96 C88 112 32 112 26 96 C20 70 45 12 60 12 Z"
    fill="#FFFFFF"
    stroke="#2D3748"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <!-- Nori / Globe Wrap on bottom -->
  <path
    d="M32 80 C42 75 78 75 88 80 C88 98 82 106 60 106 C38 106 32 98 32 80 Z"
    fill="#2B6CB0"
    stroke="#2D3748"
    stroke-width="3"
  />
  <!-- Globe Green Continents on Nori -->
  <circle cx="50" cy="92" r="5" fill="#48BB78" />
  <path d="M68 88 Q74 92 72 98 Q66 96 68 88 Z" fill="#48BB78" />
  <!-- Cute Eyes -->
  <ellipse cx="48" cy="52" rx="4" ry="5.5" fill="#1A202C" />
  <ellipse cx="72" cy="52" rx="4" ry="5.5" fill="#1A202C" />
  <!-- Eye Sparkles -->
  <circle cx="49" cy="50" r="1.5" fill="#FFFFFF" />
  <circle cx="73" cy="50" r="1.5" fill="#FFFFFF" />
  <!-- Blush Cheeks -->
  <ellipse cx="38" cy="62" rx="4" ry="2.5" fill="#FEB2B2" />
  <ellipse cx="82" cy="62" rx="4" ry="2.5" fill="#FEB2B2" />
  <!-- Happy Mouth -->
  <path
    d="M54 62 Q60 70 66 62"
    fill="#E53E3E"
    stroke="#2D3748"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- Indonesian Flag on Top Right -->
  <g transform="translate(82, 22) rotate(15)">
    <!-- Flagpole -->
    <line x1="0" y1="0" x2="0" y2="28" stroke="#718096" stroke-width="2.5" stroke-linecap="round" />
    <!-- Red top -->
    <rect x="0" y="0" width="18" height="6" fill="#E53E3E" stroke="#2D3748" stroke-width="1" />
    <!-- White bottom -->
    <rect x="0" y="6" width="18" height="6" fill="#FFFFFF" stroke="#2D3748" stroke-width="1" />
  </g>
  <!-- Thumbs up hand -->
  <path
    d="M92 64 C96 62 100 66 98 70 C96 74 92 76 90 74 Z"
    fill="#FFFFFF"
    stroke="#2D3748"
    stroke-width="2.5"
  />
</svg>
