<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE1B38" />
      <stop offset="60%" stop-color="#C41230" />
      <stop offset="100%" stop-color="#8B0014" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Soft Ambient Inner Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base (Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#innerGlow)" />
  
  <!-- Subtle Outer Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />

  <!-- Center Decorative Shield Container -->
  <g filter="url(#iconShadow)">
    <!-- White Circular Emblem Base -->
    <circle cx="256" cy="236" r="148" fill="#FFFFFF" />
    <circle cx="256" cy="236" r="142" fill="#FFFDF9" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Shopping Basket & Rice Stalk Motif -->
    <!-- Indonesian Flag Mini Badge at Top of Emblem -->
    <g transform="translate(256, 126)">
      <rect x="-36" y="-14" width="72" height="14" rx="4" fill="#C41230" />
      <rect x="-36" y="0" width="72" height="14" rx="4" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" />
    </g>

    <!-- Shopping Basket Illustration -->
    <g transform="translate(256, 238) scale(1.15)">
      <!-- Basket Handle -->
      <path d="M-55,-10 C-55,-65 55,-65 55,-10" fill="none" stroke="#C41230" stroke-width="9" stroke-linecap="round" />
      <path d="M-45,-10 C-45,-55 45,-55 45,-10" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

      <!-- Basket Body -->
      <path d="M-65, -5 L65, -5 L52, 55 L-52, 55 Z" fill="#C41230" rx="6" />
      <!-- Basket Texture Lines -->
      <line x1="-58" y1="12" x2="58" y2="12" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9" />
      <line x1="-54" y1="28" x2="54" y2="28" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9" />
      <line x1="-48" y1="44" x2="48" y2="44" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9" />
      <line x1="0" y1="-5" x2="0" y2="55" stroke="url(#goldGrad)" stroke-width="3.5" />
      <line x1="-30" y1="-5" x2="-26" y2="55" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />
      <line x1="30" y1="-5" x2="26" y2="55" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />

      <!-- Rice Grain / Gold Sparkles -->
      <circle cx="-38" cy="-18" r="7" fill="url(#goldGrad)" />
      <circle cx="38" cy="-18" r="7" fill="url(#goldGrad)" />
      <polygon points="0,-28 5,-16 18,-16 8,-8 11,5 0,-2 -11,5 -8,-8 -18,-16 -5,-16" fill="url(#goldGrad)" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- SEMBAKO NUSANTARA -->
  <text x="256" y="424" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">SEMBAKO</text>
  <text x="256" y="460" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="url(#goldGrad)" letter-spacing="4">NUSANTARA</text>
</svg>
